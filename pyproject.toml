[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "growr"
dynamic = ["version"]
description = "Read-only Solana token, token-account, and wallet analysis CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "solana>=0.36,<0.37",
    "solders>=0.23,<0.27",
]

[project.scripts]
growr = "growr:main"

[tool.setuptools]
py-modules = ["growr"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["growr_cli", "growr_cli.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "growr_cli.__version__"}

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "setuptools>=77,<85",
    "jsonschema[format-nongpl]>=4,<5",
    "mypy",
    "pytest",
    "ruff",
    "types-requests",
    "types-jsonschema",
]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["venv", ".venv", ".agents"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "N",
    "C90",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "D205",
    "W505",
]
# String interpolation uses percent placeholders by project convention.
ignore = ["UP031", "UP032"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
warn_unused_ignores = true
# Parameters intentionally use inferred types; check function bodies.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "solana.*",
    "solders.*",
    "dotenv",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
